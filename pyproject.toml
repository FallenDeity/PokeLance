[project]
name = "pokelance"
version = "0.2.16"
description = "A flexible and easy to use pokemon library."
authors = [{ name = "FallenDeity", email = "61227305+FallenDeity@users.noreply.github.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.14.3",
    "attrs>=26.1.0",
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0.20260518",
]

[dependency-groups]
dev = [
    "black>=22.12.0,<23",
    "isort>=5.13.2,<6",
    "ruff>=0.1.9,<0.1.10",
    "pygments>=2.20.0,<3",
    "mkdocs>=1.6.1,<2",
    "typing-extensions>=4.16.0,<5",
    "pre-commit>=2.21.0,<3",
    "CairoSVG>=2.5.2,<3",
    "mypy>=1.8.0,<1.9",
    "pipwin>=0.5.2,<0.6",
    "pytest>=7.4.4,<8",
    "pytest-asyncio>=0.23.8,<0.24",
    "auto-changelog>=0.6.0,<0.7",
    "deepdiff>=6.7.1,<7",
    "pytkdocs[numpy-style]>=0.16.5",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-material>=9.7.7,<10",
    "pytest-coverage>=0.0",
    "markdown-exec[ansi]>=1.12.3",
    "mkdocs-jupyter>=0.26.3",
    "pillow>=12.3.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["pokelance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing"

[tool.coverage.run]
source = ["pokelance"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if t\\.TYPE_CHECKING",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = [
    "scripts/",
]
