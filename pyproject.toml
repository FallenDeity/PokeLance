[project]
name = "pokelance"
version = "0.2.14"
description = "A flexible and easy to use pokemon library."
authors = [{ name = "FallenDeity", email = "61227305+FallenDeity@users.noreply.github.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiofiles>=23.1.0,<24",
    "types-aiofiles>=23.1.0.1,<24",
    "attrs>=23.1.0,<24",
    "aiohttp>=3.13.5",
]

[dependency-groups]
dev = [
    "black>=22.12.0,<23",
    "isort>=5.10.1,<6",
    "ruff>=0.0.171,<0.1.10",
    "pygments>=2.16.0,<3",
    "mkdocs>=1.5.2,<2",
    "typing-extensions>=4.4.0,<5",
    "pre-commit>=2.20.0,<3",
    "Pillow>=9.3,<11.0",
    "CairoSVG>=2.5.2,<3",
    "mypy>=0.991,<1.9",
    "pipwin>=0.5.2,<0.6",
    "pytest>=7.4.3,<8",
    "pytest-asyncio>=0.23.2,<0.24",
    "auto-changelog>=0.6.0,<0.7",
    "deepdiff>=6.7.1,<7",
    "pytkdocs[numpy-style]>=0.5.0",
    "mkdocstrings[python]>=0.18",
    "mkdocs-material>=9.5.48,<10",
    "pytest-coverage>=0.0",
    "markdown-exec[ansi]>=1.9.3",
    "mkdocs-jupyter>=0.25.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["pokelance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing"

[tool.coverage.run]
source = ["pokelance"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if t\\.TYPE_CHECKING",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.9"
strict = true
exclude = [
    "scripts/",
]
