site_name: PokeLance
repo_name: FallenDeity/PokeLance
repo_url: https://github.com/FallenDeity/PokeLance
edit_uri: edit/master/docs/
site_description: Documentation for the PokeApi wrapper, PokeLance.
site_author: FallenDeity
copyright: Copyright FallenDeity ( 2022 - present )
site_url: https://FallenDeity.github.io/PokeLance

theme:
  name: "material"
  language: en
  custom_dir: docs/overrides
  logo: assets/pokelance.png
  favicon: assets/pokelance.png

  font:
    text: Inter
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    annotation: material/plus-circle

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: light
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light Mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Dark Mode

extra_css:
  - assets/stylesheets/custom.css

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          options:
            extensions:
              - griffe_typingdoc
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            show_root_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            unwrap_annotated: true
            merge_init_into_class: true
            inherited_members: false
            members_order: source
            filters:
              - "!^_"
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://niquests.readthedocs.io/en/latest/objects.inv
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true
  - social:
      cards_layout_options:
        background_color: "#3761A3"
        color: "#FFFFFF"

nav:
  - Getting Started: index.md
  - Guide:
      - Overview: guide/index.md
      - Installation: guide/installation.md
      - Quickstart: guide/quickstart.md
      - Configuration: guide/configuration.md
      - Fetching Data: guide/fetching_data.md
      - Extensions Reference: guide/extensions.md
      - Caching In Depth: guide/caching.md
      - Error Handling: guide/error_handling.md
      - Media - Sprites & Cries: guide/media.md
      - Recipes:
          - Discord Bot: guide/recipes/discord_bot.md
          - FastAPI Service: guide/recipes/fastapi.md
          - Notebook Playground: guide/recipes/playground.ipynb
  - API Reference:
      - PokeLance: api_reference/pokelance.md
      - Logging: api_reference/logger.md
      - Exceptions: api_reference/exceptions.md
      - Constants: api_reference/constants.md
      - Cache:
          - Base: api_reference/cache/_base.md
          - Async: api_reference/cache/_async.md
          - Sync: api_reference/cache/sync.md
      - Http:
          - Client: api_reference/http/httpclient.md
          - Routes: api_reference/http/routes.md
      - Extensions:
          - Base: api_reference/ext/_base.md
          - Async:
              - Berry: api_reference/ext/_async/berry.md
              - Contest: api_reference/ext/_async/contest.md
              - Encounter: api_reference/ext/_async/encounter.md
              - Evolution: api_reference/ext/_async/evolution.md
              - Game: api_reference/ext/_async/game.md
              - Item: api_reference/ext/_async/item.md
              - Location: api_reference/ext/_async/location.md
              - Machine: api_reference/ext/_async/machine.md
              - Move: api_reference/ext/_async/move.md
              - Pokemon: api_reference/ext/_async/pokemon.md
              - Utility: api_reference/ext/_async/utility.md
          - Sync:
              - Berry: api_reference/ext/sync/berry.md
              - Contest: api_reference/ext/sync/contest.md
              - Encounter: api_reference/ext/sync/encounter.md
              - Evolution: api_reference/ext/sync/evolution.md
              - Game: api_reference/ext/sync/game.md
              - Item: api_reference/ext/sync/item.md
              - Location: api_reference/ext/sync/location.md
              - Machine: api_reference/ext/sync/machine.md
              - Move: api_reference/ext/sync/move.md
              - Pokemon: api_reference/ext/sync/pokemon.md
              - Utility: api_reference/ext/sync/utility.md
      - Models:
          - Base: api_reference/models/base.md
          - Common:
              - Resources: api_reference/models/common/resources.md
              - Models: api_reference/models/common/models.md
          - Abstract:
              - Utility:
                  - Berries: api_reference/models/abstract/utils/berries.md
                  - Contests: api_reference/models/abstract/utils/contests.md
                  - Evolutions: api_reference/models/abstract/utils/evolutions.md
                  - Games: api_reference/models/abstract/utils/games.md
                  - Items: api_reference/models/abstract/utils/items.md
                  - Locations: api_reference/models/abstract/utils/locations.md
                  - Moves: api_reference/models/abstract/utils/moves.md
                  - Pokemons: api_reference/models/abstract/utils/pokemons.md
              - Berry: api_reference/models/abstract/berry.md
              - Contest: api_reference/models/abstract/contest.md
              - Encounter: api_reference/models/abstract/encounter.md
              - Evolution: api_reference/models/abstract/evolution.md
              - Game: api_reference/models/abstract/game.md
              - Item: api_reference/models/abstract/item.md
              - Location: api_reference/models/abstract/location.md
              - Machine: api_reference/models/abstract/machine.md
              - Move: api_reference/models/abstract/move.md
              - Pokemon: api_reference/models/abstract/pokemon.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      linenums_style: pymdownx-inline
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: FallenDeity
      repo: PokeLance
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version: 1.0.0b1
  generator: false
  comments:
    enabled: true
    mode: giscus
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FallenDeity/PokeLance
    - icon: fontawesome/brands/discord
      link: https://discord.gg/yeyEvT5V2J
